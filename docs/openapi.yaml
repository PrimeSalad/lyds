        highest_grade_completed:
          type: [string, "null"]
        nature_of_work:
          type: string
        father_name:
          type: [string, "null"]
        mother_name:
          type: [string, "null"]
        guardian_name:
          type: [string, "null"]
        parent_guardian_occupation:
