openapi: 3.1.0
info:
  title: 2026 Boilerplate API
  version: 1.2.0
  description: |
    Contract-first API definition for the 2026 boilerplate.
    `/api/*` endpoints are the preferred integration path for API clients.
servers:
  - url: http://localhost:3000
tags:
  - name: session
    description: Session lifecycle endpoints
  - name: app
    description: Application API endpoints
  - name: legacy
    description: Legacy browser form endpoints kept for compatibility
paths:
  /api/session:
    post:
      tags: [session]
      summary: Create authenticated session
      description: Authenticates credentials and sets the `token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [session]
      summary: Delete authenticated session
      description: Clears the `token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrfOnly'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CsrfOnly'
      responses:
        '204':
          description: Session deleted
  /api/key:
    get:
      tags: [app]
      summary: Get local-storage encryption key
      responses:
        '200':
          description: Encryption key payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionKeyResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records:
    post:
      tags: [app]
      summary: Create a youth record
      description: |
        Creates a youth profile. Birth date is optional when it has not yet
        been collected; age and youth age group are then returned as null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYouthRecordInput'
      responses:
        '201':
          description: Youth record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordResponse'
        '400':
          description: Invalid record data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories:
    get:
      tags: [app]
      summary: List categories with live totals
      description: Returns visible categories with access-scoped non-deleted record counts and active field counts.
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports/export:
    get:
      tags: [app]
      summary: Export youth records
      description: |
        Exports all non-deleted youth records in scope. When `filingYear` is
        supplied with XLSX format, the workbook uses the official KK Youth
        Profile layout and filename `KK Youth Profile <year>.xlsx`. SK
        officials are always restricted to their assigned barangay.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, xlsx]
            default: xlsx
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
      responses:
        '200':
          description: Spreadsheet or CSV export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid export filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login/password:
    post:
      tags: [legacy]
      summary: Legacy form login
      description: Browser form endpoint preserved for compatibility.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
      responses:
        '302':
          description: Redirects to `/product` or `/login`
        '429':
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string
  /logout:
    get:
      tags: [legacy]
      summary: Legacy logout route
      description: Browser redirect endpoint preserved for compatibility.
      responses:
        '302':
          description: Redirects to `/`
components:
  schemas:
    CsrfOnly:
      type: object
      required: [_csrf]
      properties:
        _csrf:
          type: string
    SessionCredentials:
      type: object
      required: [_csrf, username, password]
      properties:
        _csrf:
          type: string
        username:
          type: string
        password:
          type: string
    SessionUser:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    CreateSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
    EncryptionKeyResponse:
      type: object
      required: [key]
      properties:
        key:
          type: [string, "null"]
    CreateYouthRecordInput:
      type: object
      required: [category_id, first_name, last_name]
      properties:
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        suffix:
          type: string
        birth_date:
          type: [string, "null"]
          format: date
          description: May be null when the source record has no known birth date.
        submit_on_create:
          type: boolean
          default: false
    YouthRecord:
      type: object
      required: [id, category_id, barangay_id, display_name, birth_date, age_at_submission, status]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        display_name:
          type: string
        birth_date:
          type: [string, "null"]
          format: date
        age_at_submission:
          type: [integer, "null"]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
    YouthRecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/YouthRecord'
    CategorySummary:
      type: object
      required:
        - id
        - code
        - name
        - record_type
        - filing_year
        - status
        - permission_mode
        - allow_sk_export
        - record_count
        - field_count
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        record_type:
          type: string
        filing_year:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        permission_mode:
          type: string
          enum: [SK_FILLABLE, SK_VIEW_ONLY, ADMIN_ONLY, PUBLIC, RESTRICTED, PRIVATE]
        allow_sk_export:
          type: boolean
        record_count:
          type: integer
          minimum: 0
        field_count:
          type: integer
          minimum: 0
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
