openapi: 3.1.0
info:
  title: 2026 Boilerplate API
  version: 1.2.0
  description: |
    Contract-first API definition for the 2026 boilerplate.
    `/api/*` endpoints are the preferred integration path for API clients.
servers:
  - url: http://localhost:3000
tags:
  - name: session
    description: Session lifecycle endpoints
  - name: app
    description: Application API endpoints
  - name: legacy
    description: Legacy browser form endpoints kept for compatibility
paths:
  /api/session:
    post:
      tags: [session]
      summary: Create authenticated session
      description: Authenticates credentials and sets the `token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [session]
      summary: Delete authenticated session
      description: Clears the `token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrfOnly'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CsrfOnly'
      responses:
        '204':
          description: Session deleted
  /api/key:
    get:
      tags: [app]
      summary: Get local-storage encryption key
      responses:
        '200':
          description: Encryption key payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionKeyResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records:
    post:
      tags: [app]
      summary: Create a youth record
      description: |
        Creates a youth profile. Birth date is optional when it has not yet
        been collected; age and youth age group are then returned as null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYouthRecordInput'
      responses:
        '201':
          description: Youth record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordResponse'
        '400':
          description: Invalid record data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records/approve-drafts:
    post:
      tags: [app]
      summary: Approve all draft youth records
      description: Admin bulk action that marks every non-deleted draft youth profile as approved.
      responses:
        '200':
          description: Draft records approved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approved_count]
                    properties:
                      approved_count:
                        type: integer
                        minimum: 0
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records/approve-submitted-by-barangay:
    post:
      tags: [app]
      summary: Approve submitted youth records for one barangay
      description: |
        Admin-only bulk review action. Approves every non-deleted submitted
        youth profile in the selected barangay, optionally restricted to one
        annual filing year.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSubmittedByBarangayInput'
      responses:
        '200':
          description: Barangay submissions approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApprovalResponse'
        '400':
          description: Invalid barangay or filing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records/{recordId}:
    parameters:
      - in: path
        name: recordId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [app]
      summary: Get a youth record profile
      description: Returns editable profile data with readable barangay, category, and reference-option labels.
      responses:
        '200':
          description: Youth record profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordDetailResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Record is outside the account's barangay scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Youth record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [app]
      summary: Update a youth record profile
      description: Updates editable profile information using optimistic version checking. Administrators may update any non-archived record without changing its workflow status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateYouthRecordInput'
      responses:
        '200':
          description: Youth record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordResponse'
        '400':
          description: Invalid record data or status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Editing is not allowed for this account or record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Youth record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories:
    get:
      tags: [app]
      summary: List categories with live totals
      description: Returns visible categories with access-scoped non-deleted record counts and active field counts.
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [app]
      summary: Delete an archived category
      description: Soft-deletes an archived category so historical youth records can keep their category reference.
      responses:
        '204':
          description: Category deleted
        '400':
          description: Only archived categories can be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication required or not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports:
    get:
      tags: [app]
      summary: List spreadsheet import batches
      description: Returns paginated import history. SK officials are restricted to their assigned barangay.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ImportBatchStatus'
        - in: query
          name: barangayId
          description: Administrator-only barangay filter.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import batch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/validate:
    post:
      tags: [app]
      summary: Upload and validate a youth spreadsheet
      description: |
        Detects the spreadsheet header row, normalizes supported KK Youth Profile
        columns, checks ages against December 31 of the selected filing year,
        and marks duplicate names within that barangay and annual category.
        This step does not create youth records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateImportInput'
      responses:
        '201':
          description: Spreadsheet validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '403':
          description: Category or barangay is outside the account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unsupported or invalid spreadsheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/template:
    get:
      tags: [app]
      summary: Download the youth spreadsheet template
      responses:
        '200':
          description: XLSX import template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/imports/{batchId}:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: Get an import batch
      responses:
        '200':
          description: Import batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '403':
          description: Import batch is outside the account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Import batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: List row validation results
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated spreadsheet row results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRowListResponse'
  /api/v1/imports/{batchId}/commit:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    post:
      tags: [app]
      summary: Commit a validated import atomically
      description: Creates submitted youth profiles for valid rows and rechecks duplicates under a transaction lock.
      responses:
        '200':
          description: Import committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitImportResponse'
        '422':
          description: Batch has no valid rows or is no longer committable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/{batchId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    post:
      tags: [app]
      summary: Cancel an uncommitted import batch
      responses:
        '200':
          description: Import cancelled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [success]
                    properties:
                      success:
                        type: boolean
  /api/v1/imports/{batchId}/error-file:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: Download invalid and duplicate row details
      responses:
        '200':
          description: XLSX correction report
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/reports/dashboard:
    get:
      tags: [app]
      summary: Get dashboard analytics
      description: |
        Returns dashboard analytics within the authenticated account scope.
        Pass `filingYear` to limit youth-profile metrics and barangay coverage
        to annual Youth Profile categories for that filing year.
      parameters:
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsResponse'
        '400':
          description: Invalid filing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports/export:
    get:
      tags: [app]
      summary: Export youth records
      description: |
        Exports all non-deleted youth records in scope. When `filingYear` is
        supplied with XLSX format, the workbook uses the official KK Youth
        Profile layout and filename `KK Youth Profile <year>.xlsx`. SK
        officials are always restricted to their assigned barangay.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, xlsx]
            default: xlsx
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
      responses:
        '200':
          description: Spreadsheet or CSV export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid export filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login/password:
    post:
      tags: [legacy]
      summary: Legacy form login
      description: Browser form endpoint preserved for compatibility.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCredentials'
      responses:
        '302':
          description: Redirects to `/product` or `/login`
        '429':
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string
  /logout:
    get:
      tags: [legacy]
      summary: Legacy logout route
      description: Browser redirect endpoint preserved for compatibility.
      responses:
        '302':
          description: Redirects to `/`
components:
  parameters:
    ImportBatchId:
      in: path
      name: batchId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CsrfOnly:
      type: object
      required: [_csrf]
      properties:
        _csrf:
          type: string
    SessionCredentials:
      type: object
      required: [_csrf, username, password]
      properties:
        _csrf:
          type: string
        username:
          type: string
        password:
          type: string
    SessionUser:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    CreateSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
    EncryptionKeyResponse:
      type: object
      required: [key]
      properties:
        key:
          type: [string, "null"]
    CreateYouthRecordInput:
      type: object
      required: [category_id, first_name, last_name]
      properties:
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        suffix:
          type: string
        birth_date:
          type: [string, "null"]
          format: date
          description: May be null when the source record has no known birth date.
        submit_on_create:
          type: boolean
          default: false
    UpdateYouthRecordInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        suffix:
          type: string
        birth_date:
          type: [string, "null"]
          format: date
        sex_assigned_at_birth_id:
          type: string
          format: uuid
        civil_status_id:
          type: string
          format: uuid
        youth_classification_id:
          type: string
          format: uuid
        educational_attainment_id:
          type: string
          format: uuid
        work_status_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        contact_number:
          type: string
        is_registered_voter:
          type: boolean
        voted_last_election:
          type: boolean
        attended_kk_assembly:
          type: boolean
        kk_assembly_count:
          type: integer
          minimum: 0
        custom_values:
          type: object
          additionalProperties: true
        submit_on_update:
          type: boolean
          default: false
    YouthRecord:
      type: object
      required: [id, category_id, barangay_id, display_name, birth_date, age_at_submission, status]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        display_name:
          type: string
        birth_date:
          type: [string, "null"]
          format: date
        age_at_submission:
          type: [integer, "null"]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
    YouthRecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/YouthRecord'
    YouthRecordDetail:
      allOf:
        - $ref: '#/components/schemas/YouthRecord'
        - type: object
          required: [first_name, last_name, version, created_at]
          properties:
            first_name:
              type: string
            middle_name:
              type: [string, "null"]
            last_name:
              type: string
            suffix:
              type: [string, "null"]
            version:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            submitted_at:
              type: [string, "null"]
              format: date-time
            approved_at:
              type: [string, "null"]
              format: date-time
            return_reason:
              type: [string, "null"]
            email:
              type: [string, "null"]
              format: email
            contact_number:
              type: [string, "null"]
            sex_assigned_at_birth_id:
              type: [string, "null"]
              format: uuid
            civil_status_id:
              type: [string, "null"]
              format: uuid
            youth_classification_id:
              type: [string, "null"]
              format: uuid
            educational_attainment_id:
              type: [string, "null"]
              format: uuid
            work_status_id:
              type: [string, "null"]
              format: uuid
            sex_label:
              type: [string, "null"]
            civil_status_label:
              type: [string, "null"]
            youth_classification_label:
              type: [string, "null"]
            youth_age_group_label:
              type: [string, "null"]
            educational_attainment_label:
              type: [string, "null"]
            work_status_label:
              type: [string, "null"]
            barangay_name:
              type: [string, "null"]
            municipality_name:
              type: [string, "null"]
            province_name:
              type: [string, "null"]
            category_name:
              type: [string, "null"]
            category_filing_year:
              type: [integer, "null"]
            is_registered_voter:
              type: boolean
            voted_last_election:
              type: [boolean, "null"]
            attended_kk_assembly:
              type: boolean
            kk_assembly_count:
              type: integer
            custom_values:
              type: object
              additionalProperties: true
    YouthRecordDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/YouthRecordDetail'
    CategorySummary:
      type: object
      required:
        - id
        - code
        - name
        - record_type
        - filing_year
        - status
        - permission_mode
        - allow_sk_export
        - record_count
        - field_count
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        record_type:
          type: string
        filing_year:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        permission_mode:
          type: string
          enum: [SK_FILLABLE, SK_VIEW_ONLY, ADMIN_ONLY, PUBLIC, RESTRICTED, PRIVATE]
        allow_sk_export:
          type: boolean
        record_count:
          type: integer
          minimum: 0
        field_count:
          type: integer
          minimum: 0
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
    ImportBatchStatus:
      type: string
      enum: [UPLOADING, VALIDATING, VALIDATED, COMMITTING, COMMITTED, FAILED, CANCELLED]
    ValidateImportInput:
      type: object
      required: [categoryId, fileData, fileName, fileType]
      properties:
        categoryId:
          type: string
          format: uuid
        barangayId:
          type: string
          format: uuid
          description: Required for administrators; ignored in favor of the assigned barangay for SK officials.
        fileData:
          type: string
          format: byte
          description: Base64-encoded XLSX or CSV content, up to 10 MB before encoding.
        fileName:
          type: string
          maxLength: 255
        fileType:
          type: string
          maxLength: 150
    ImportBatch:
      type: object
      required:
        - id
        - category_id
        - barangay_id
        - uploaded_by
        - file_name
        - status
        - total_rows
        - valid_rows
        - invalid_rows
        - duplicate_rows
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        barangay_id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        file_name:
          type: string
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        total_rows:
          type: integer
          minimum: 0
        valid_rows:
          type: integer
          minimum: 0
        invalid_rows:
          type: integer
          minimum: 0
        duplicate_rows:
          type: integer
          minimum: 0
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        barangay_name:
          type: [string, "null"]
        category_name:
          type: [string, "null"]
        filing_year:
          type: [integer, "null"]
        uploaded_by_name:
          type: [string, "null"]
    ImportRow:
      type: object
      required:
        - id
        - row_number
        - raw_data
        - normalized_data
        - is_valid
        - is_duplicate
        - validation_errors
        - validation_warnings
      properties:
        id:
          type: string
          format: uuid
        row_number:
          type: integer
          minimum: 1
        raw_data:
          type: object
          additionalProperties: true
        normalized_data:
          type: [object, "null"]
          additionalProperties: true
        is_valid:
          type: boolean
        is_duplicate:
          type: boolean
        duplicate_match_id:
          type: [string, "null"]
          format: uuid
        validation_errors:
          type: array
          items:
            type: string
        validation_warnings:
          type: array
          items:
            type: string
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ImportBatchResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ImportBatch'
    ImportBatchListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatch'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ImportRowListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CommitImportResult:
      allOf:
        - type: object
          required: [batch, batch_id, imported_count, invalid_rows, duplicate_rows, status]
          properties:
            batch:
              $ref: '#/components/schemas/ImportBatch'
            batch_id:
              type: string
              format: uuid
            imported_count:
              type: integer
              minimum: 0
            invalid_rows:
              type: integer
              minimum: 0
            duplicate_rows:
              type: integer
              minimum: 0
            status:
              type: string
              const: COMMITTED
    CommitImportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CommitImportResult'
    BarangayCoverageItem:
      type: object
      required: [barangayId, barangayName, isActive, totalRecords, pendingReview, approved, lastActivityAt]
      properties:
        barangayId:
          type: string
          format: uuid
        barangayName:
          type: string
        isActive:
          type: boolean
        totalRecords:
          type: integer
          minimum: 0
        pendingReview:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
        lastActivityAt:
          type: [string, "null"]
          format: date-time
    CoverageSummary:
      type: object
      required: [barangaysWithRecords, totalBarangays, percentage]
      properties:
        barangaysWithRecords:
          type: integer
          minimum: 0
        totalBarangays:
          type: integer
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
    DashboardAnalytics:
      type: object
      required: [barangayCoverage, coverage, generatedAt]
      additionalProperties: true
      properties:
        barangayCoverage:
          type: array
          items:
            $ref: '#/components/schemas/BarangayCoverageItem'
        coverage:
          $ref: '#/components/schemas/CoverageSummary'
        generatedAt:
          type: string
          format: date-time
    DashboardAnalyticsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DashboardAnalytics'
    ApproveSubmittedByBarangayInput:
