openapi: 3.1.0
info:
  title: SK Youth Information Management System API
  version: 1.7.0
  description: |
    Contract-first definition for the SK Youth Information Management System.
    Authentication is handled by Supabase Auth. Protected endpoints require an
    access token whose authenticator assurance level is `aal2` (password plus a
    verified second factor).
servers:
  - url: http://localhost:4000
tags:
  - name: auth
    description: Current application profile endpoints
  - name: app
    description: Application API endpoints
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [app]
      summary: Check API process health
      security: []
      responses:
        '200':
          description: API process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user's authorization context
      responses:
        '200':
          description: Current authorization context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContextResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Verified two-factor authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/profile:
    get:
      tags: [auth]
      summary: Get the authenticated user's account settings
      responses:
        '200':
          description: Account profile and login email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettingsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [auth]
      summary: Update the authenticated user's profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnProfileInput'
      responses:
        '200':
          description: Updated account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Invalid profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password-change-completed:
    post:
      tags: [auth]
      summary: Confirm a successful authenticated password replacement
      description: |
        Called immediately after Supabase accepts a password update with the
        current password. Clears the account's forced temporary-password flag
        and records the security event in the audit log.
      responses:
        '204':
          description: Password-change requirement cleared
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Verified two-factor authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}:
    parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [app]
      summary: Permanently delete an account and its unapproved data
      description: |
        Admin-only operation. Removes the account's never-approved youth
        records, import data, related audit entries, Supabase login, profile,
        and barangay assignment. The current administrator cannot delete their
        own account, and an account that created an approved youth record must
        be deactivated instead.
      responses:
        '204':
          description: Account and unapproved data permanently deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Self-deletion, approved youth records, or provider cleanup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}/reset-mfa:
    parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [app]
      summary: Reset another account's enrolled two-factor authenticators
      description: |
        Admin-only recovery operation. Removes all enrolled factors so the
        account must enroll a new authenticator after its next password sign-in.
        Administrators cannot reset their own factors through this endpoint.
      responses:
        '200':
          description: Enrolled factors removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetMfaResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Verified two-factor authentication and administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Self-reset or identity-provider cleanup failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records:
    post:
      tags: [app]
      summary: Create a youth record
      description: |
        Creates a youth profile. Birth date is optional when it has not yet
        been collected; age and youth age group are then returned as null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYouthRecordInput'
      responses:
        '201':
          description: Youth record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordResponse'
        '400':
          description: Invalid record data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/child-laborers:
    get:
      tags: [app]
      summary: List yearly child laborer records
      description: |
        Returns child laborer records within the authenticated account's
        barangay scope. Age is derived from birth date as of December 31 of
        the selected filing year so annual consolidations remain reproducible.
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ChildLaborerStatus'
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: sortField
          schema:
            type: string
            enum: [child_name, barangay_name, birth_date, gender, record_status, created_at]
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated child laborer records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerListResponse'
        '400':
          description: Invalid list filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Verified two-factor authentication or barangay access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [app]
      summary: Create a yearly child laborer record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildLaborerInput'
      responses:
        '201':
          description: Child laborer record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerResponse'
        '400':
          description: Invalid record data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Record is outside the account's barangay scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/child-laborers/summary:
    get:
      tags: [app]
      summary: Summarize yearly child laborer records
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ChildLaborerStatus'
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Filtered child laborer totals, distributions, and data-quality indicators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerSummaryResponse'
  /api/v1/child-laborers/export:
    get:
      tags: [app]
      summary: Export the yearly child laborer consolidation
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, xlsx]
            default: xlsx
        - in: query
          name: filingYear
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ChildLaborerStatus'
        - in: query
          name: search
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Child laborer spreadsheet or CSV export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
  /api/v1/child-laborers/{recordId}:
    parameters:
      - in: path
        name: recordId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [app]
      summary: Get a child laborer record
      responses:
        '200':
          description: Child laborer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerResponse'
        '404':
          description: Child laborer record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [app]
      summary: Update a child laborer record
      description: Uses optimistic version checking to prevent lost updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildLaborerInput'
      responses:
        '200':
          description: Child laborer record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerResponse'
        '409':
          description: Record was updated by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/child-laborers/{recordId}/archive:
    post:
      tags: [app]
      summary: Archive a child laborer record
      responses:
        '200':
          description: Child laborer record archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerResponse'
  /api/v1/child-laborers/{recordId}/restore:
    post:
      tags: [app]
      summary: Restore an archived child laborer record
      responses:
        '200':
          description: Child laborer record restored as identified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildLaborerResponse'
  /api/v1/youth-records/approve-drafts:
    post:
      tags: [app]
      summary: Approve all draft youth records
      description: Admin bulk action that marks every non-deleted draft youth profile as approved.
      responses:
        '200':
          description: Draft records approved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approved_count]
                    properties:
                      approved_count:
                        type: integer
                        minimum: 0
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records/approve-submitted-by-barangay:
    post:
      tags: [app]
      summary: Approve submitted youth records for one barangay
      description: |
        Admin-only bulk review action. Approves every non-deleted submitted
        youth profile in the selected barangay, optionally restricted to one
        annual filing year.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSubmittedByBarangayInput'
      responses:
        '200':
          description: Barangay submissions approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApprovalResponse'
        '400':
          description: Invalid barangay or filing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/youth-records/{recordId}:
    parameters:
      - in: path
        name: recordId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [app]
      summary: Get a youth record profile
      description: Returns editable profile data with readable barangay, category, and reference-option labels.
      responses:
        '200':
          description: Youth record profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordDetailResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Record is outside the account's barangay scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Youth record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [app]
      summary: Update a youth record profile
      description: Updates editable profile information using optimistic version checking. Administrators may update any non-archived record without changing its workflow status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateYouthRecordInput'
      responses:
        '200':
          description: Youth record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthRecordResponse'
        '400':
          description: Invalid record data or status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Editing is not allowed for this account or record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Youth record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories:
    get:
      tags: [app]
      summary: List categories with live totals
      description: Returns visible categories with access-scoped non-deleted record counts and active field counts.
      parameters:
        - in: query
          name: recordType
          description: Limits categories to one registry.
          schema:
            $ref: '#/components/schemas/CategoryRecordType'
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reference-data:
    get:
      tags: [app]
      summary: List registry-scoped reference groups
      description: Returns maintained reference groups, optionally limited to the Youth or Child Laborer registry.
      parameters:
        - in: query
          name: recordType
          description: Limits reference groups to one registry.
          schema:
            $ref: '#/components/schemas/CategoryRecordType'
      responses:
        '200':
          description: Reference group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceGroupListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reference-data/{groupCode}/options:
    parameters:
      - in: path
        name: groupCode
        required: true
        schema:
          type: string
    get:
      tags: [app]
      summary: List options in a reference group
      responses:
        '200':
          description: Reference option list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceOptionListResponse'
        '404':
          description: Reference group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [app]
      summary: Add an option to a reference group
      description: Administrator-only. The option code is normalized to uppercase words separated by underscores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferenceOptionInput'
      responses:
        '201':
          description: Reference option created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceOptionResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Option code already exists in the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reference-data/{groupCode}/options/{optionId}:
    parameters:
      - in: path
        name: groupCode
        required: true
        schema:
          type: string
      - in: path
        name: optionId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [app]
      summary: Update a reference option
      description: Administrator-only. Labels, sort order, status, descriptions, and metadata can be maintained without changing stable option codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferenceOptionInput'
      responses:
        '200':
          description: Reference option updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceOptionResponse'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reference group or option not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [app]
      summary: Delete an archived category
      description: Soft-deletes an archived category while historical youth or child laborer records retain their category reference.
      responses:
        '204':
          description: Category deleted
        '400':
          description: Only archived categories can be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication required or not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports:
    get:
      tags: [app]
      summary: List spreadsheet import batches
      description: Returns paginated import history. SK officials are restricted to their assigned barangay.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ImportBatchStatus'
        - in: query
          name: barangayId
          description: Administrator-only barangay filter.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import batch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/validate:
    post:
      tags: [app]
      summary: Upload and validate a youth spreadsheet
      description: |
        Detects the spreadsheet header row, normalizes supported KK Youth Profile
        columns, checks ages against December 31 of the selected filing year,
        and marks duplicate names within that barangay and annual category.
        This step does not create youth records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateImportInput'
      responses:
        '201':
          description: Spreadsheet validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '403':
          description: Category or barangay is outside the account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unsupported or invalid spreadsheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/template:
    get:
      tags: [app]
      summary: Download the youth spreadsheet template
      responses:
        '200':
          description: XLSX import template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/imports/{batchId}:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: Get an import batch
      responses:
        '200':
          description: Import batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponse'
        '403':
          description: Import batch is outside the account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Import batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: List row validation results
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated spreadsheet row results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRowListResponse'
  /api/v1/imports/{batchId}/commit:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    post:
      tags: [app]
      summary: Commit a validated import atomically
      description: Creates submitted youth profiles for valid rows and rechecks duplicates under a transaction lock.
      responses:
        '200':
          description: Import committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitImportResponse'
        '422':
          description: Batch has no valid rows or is no longer committable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/imports/{batchId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    post:
      tags: [app]
      summary: Cancel an uncommitted import batch
      responses:
        '200':
          description: Import cancelled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [success]
                    properties:
                      success:
                        type: boolean
  /api/v1/imports/{batchId}/error-file:
    parameters:
      - $ref: '#/components/parameters/ImportBatchId'
    get:
      tags: [app]
      summary: Download invalid and duplicate row details
      responses:
        '200':
          description: XLSX correction report
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/reports/dashboard:
    get:
      tags: [app]
      summary: Get dashboard analytics
      description: |
        Returns dashboard analytics within the authenticated account scope.
        Pass `filingYear` to limit youth-profile metrics and barangay coverage
        to annual Youth Profile categories for that filing year.
      parameters:
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsResponse'
        '400':
          description: Invalid filing year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports/summary:
    get:
      tags: [app]
      summary: Get annual youth-record workflow totals
      description: |
        Returns youth-record totals for exactly one filing year. The filing
        year is required so annual reports never silently combine datasets.
        SK officials remain restricted to their assigned barangay.
      parameters:
        - in: query
          name: filingYear
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
      responses:
        '200':
          description: Filing-year workflow totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
        '400':
          description: Missing or invalid filing year or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports/demographics:
    get:
      tags: [app]
      summary: Get annual youth demographic and participation responses
      description: |
        Returns demographic and civic-response breakdowns for exactly one
        filing year. Missing answers remain visible as `No response` and every
        percentage uses the complete year-filtered record count.
      parameters:
        - in: query
          name: filingYear
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
      responses:
        '200':
          description: Filing-year demographic and civic-response breakdowns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemographicsReportResponse'
        '400':
          description: Missing or invalid filing year or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports/export:
    get:
      tags: [app]
      summary: Export youth records
      description: |
        Exports all non-deleted youth records in scope. When `filingYear` is
        supplied with XLSX format, the workbook uses the official KK Youth
        Profile layout and filename `KK Youth Profile <year>.xlsx`. SK
        officials are always restricted to their assigned barangay.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, xlsx]
            default: xlsx
        - in: query
          name: filingYear
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: barangayId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, ARCHIVED]
      responses:
        '200':
          description: Spreadsheet or CSV export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid export filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
  parameters:
    ImportBatchId:
      in: path
      name: batchId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
        deploymentCommit:
          type: string
          description: Render Git commit for the running deployment, when supplied by the host.
    AuthContext:
      type: object
      required: [profileId, role, barangayId, accountStatus, mfaVerified, mustChangePassword]
      properties:
        profileId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, SK_OFFICIAL]
        barangayId:
          type: [string, "null"]
          format: uuid
        accountStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
        mfaVerified:
          type: boolean
          const: true
        mustChangePassword:
          type: boolean
    AuthContextResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthContext'
    Profile:
      type: object
      required: [id, full_name, role, account_status, must_change_password, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          type: string
          enum: [ADMIN, SK_OFFICIAL]
        account_status:
          type: string
          enum: [ACTIVE, INACTIVE]
        position_title:
          type: [string, "null"]
        contact_number:
          type: [string, "null"]
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Profile'
    ResetMfaResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [removed_factors]
          properties:
            removed_factors:
              type: integer
              minimum: 0
    AccountSettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [profile, email]
          properties:
            profile:
              $ref: '#/components/schemas/Profile'
            email:
              type: string
              format: email
    UpdateOwnProfileInput:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        contact_number:
          type: string
          maxLength: 50
        position_title:
          type: string
          maxLength: 200
    ChildLaborerStatus:
      type: string
      enum: [IDENTIFIED, VALIDATED, REFERRED, MONITORED, CLOSED, ARCHIVED]
    ChildLaborerGender:
      type: string
      enum: [MALE, FEMALE, NOT_SPECIFIED]
    CreateChildLaborerInput:
      type: object
      required:
        - category_id
        - filing_year
        - first_name
        - last_name
        - birth_date
        - gender
        - attending_school
        - nature_of_work
      properties:
        category_id:
          type: string
          format: uuid
          description: Published CHILD_LABORER category that defines the filing year and optional custom fields.
        filing_year:
          type: integer
          minimum: 2000
          maximum: 2100
        barangay_id:
          type: string
          format: uuid
          description: Required for administrators; ignored in favor of the assigned barangay for SK officials.
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        birth_date:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/ChildLaborerGender'
        attending_school:
          type: boolean
        highest_grade_completed:
          type: string
          maxLength: 150
        nature_of_work:
          type: string
          minLength: 1
          maxLength: 300
        father_name:
          type: string
          maxLength: 200
        mother_name:
          type: string
          maxLength: 200
        guardian_name:
          type: string
          maxLength: 200
          description: At least one parent or guardian name must be supplied.
        parent_guardian_occupation:
          type: string
          maxLength: 300
        record_status:
          allOf:
            - $ref: '#/components/schemas/ChildLaborerStatus'
          default: IDENTIFIED
        remarks:
          type: string
          maxLength: 1000
          description: Required when record_status is VALIDATED; validation percentages are based on current record statuses backed by remarks.
        custom_values:
          type: object
          additionalProperties: true
          default: {}
    UpdateChildLaborerInput:
      allOf:
        - $ref: '#/components/schemas/CreateChildLaborerInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1
    ChildLaborerRecord:
      type: object
      required:
        - id
        - category_id
        - category_name
        - filing_year
        - barangay_id
        - barangay_name
        - first_name
        - middle_name
        - last_name
        - child_name
        - birth_date
        - age
        - gender
        - attending_school
        - highest_grade_completed
        - nature_of_work
        - father_name
        - mother_name
        - guardian_name
        - parent_guardian_occupation
        - record_status
        - remarks
        - custom_values
        - version
        - created_at
        - updated_at
