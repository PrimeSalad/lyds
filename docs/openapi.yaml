          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        row_number:
          type: integer
          minimum: 1
        filing_year:
          type: integer
        barangay_id:
          type: string
          format: uuid
        barangay_name:
          type: string
        first_name:
          type: string
        middle_name:
          type: [string, "null"]
        last_name:
          type: string
        child_name:
          type: string
        birth_date:
          type: string
          format: date
